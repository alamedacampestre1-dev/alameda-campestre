<head>
<meta charset="UTF-8">

<title>Bitácora de Parqueaderos</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2F8F3B">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bitácora Parq.">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<style>
  :root{
    --bg:#121A14;
    --surface:#1C2A1E;
    --surface-2:#243526;
    --raised:#2E4230;
    --amber:#2F8F3B;
    --amber-dark:#1F6329;
    --alert:#E85D42;
    --ok:#48B383;
    --info:#5B8DEF;
    --text:#F3F1EA;
    --text-dim:#93A1B0;
    --border: rgba(255,255,255,0.09);
    --radius: 20px;
    --radius-sm: 12px;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:
      radial-gradient(1200px 600px at 50% -10%, #1a2a1c 0%, var(--bg) 60%);
    color:var(--text);
    font-family:'Inter',system-ui,sans-serif;
    -webkit-tap-highlight-color: transparent;
    user-select:none;
    min-height:100%;
  }
  h1,h2,h3,.display{
    font-family:'Barlow Condensed', sans-serif;
    font-weight:800;
    letter-spacing:0.02em;
    text-transform:uppercase;
  }
  #app{
    max-width:800px;
    margin:0 auto;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    padding-bottom:24px;
  }
  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:16px 20px;
    border-bottom:1px solid var(--border);
    position:sticky;
    top:0;
    background:rgba(22,29,38,0.92);
    backdrop-filter:blur(6px);
    z-index:10;
  }
  .topbar .who{display:flex;flex-direction:column;line-height:1.15;}
  .topbar .who b{font-size:17px;}
  .topbar .who span{font-size:12px;color:var(--text-dim);}
  .iconbtn{
    background:var(--surface-2);
    border:1px solid var(--border);
    color:var(--text-dim);
    border-radius:12px;
    padding:10px 14px;
    font-size:13px;
    font-weight:600;
  }
  main{flex:1;padding:20px;}
  .stepper{display:flex;gap:8px;justify-content:center;margin:6px 0 22px;}
  .stepper .dot{width:26px;height:6px;border-radius:4px;background:var(--surface-2);}
  .stepper .dot.active{background:var(--amber);}
  .stepper .dot.done{background:var(--ok);}
  .stepLabel{
    text-align:center;color:var(--text-dim);
    font-size:13px;margin-bottom:2px;
    letter-spacing:0.08em;text-transform:uppercase;font-weight:600;
  }
  .bigTitle{font-size:32px;text-align:center;margin:4px 0 18px;}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:22px;}
  .btn{
    display:flex;align-items:center;justify-content:center;gap:10px;
    border:none;border-radius:var(--radius-sm);
    font-family:'Inter',sans-serif;font-weight:700;font-size:18px;padding:20px;
    cursor:pointer;transition:transform .08s ease;color:var(--text);
    background:var(--surface-2);border:1px solid var(--border);
  }
  .btn:active{transform:scale(0.97);}
  .btn-primary{background:var(--amber);color:#F6FBF2;font-size:20px;}
  .btn-primary:active{background:var(--amber-dark);}
  .btn-ghost{background:transparent;border:1px solid var(--border);color:var(--text-dim);font-size:15px;padding:14px;}
  .btn[disabled]{opacity:.4;}
  .homeGrid{display:flex;flex-direction:column;gap:16px;margin-top:10px;}
  .homeGrid .btn{padding:30px;font-size:22px;}
  .guardGrid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px;}
  .guardGrid .btn{padding:26px 12px;font-size:20px;flex-direction:column;}
  .plateDisplay{
    font-family:'Barlow Condensed',sans-serif;font-size:52px;font-weight:800;letter-spacing:0.12em;
    text-align:center;background:var(--surface-2);border:2px dashed var(--border);
    border-radius:var(--radius-sm);padding:18px 10px;margin-bottom:18px;min-height:76px;
    display:flex;align-items:center;justify-content:center;color:var(--amber);
  }
  .plateDisplay.empty{color:var(--text-dim);font-size:19px;letter-spacing:0.05em;}
  .keypad{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;}
  .keypad.narrow{grid-template-columns:repeat(5,1fr);}
  .keypad button{aspect-ratio:1/0.85;border-radius:10px;border:1px solid var(--border);background:var(--surface-2);color:var(--text);font-size:19px;font-weight:700;font-family:'Inter',sans-serif;}
  .keypad button:active{background:var(--raised);}
  .keyrow-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px;}
  .keyrow-actions button{padding:16px;border-radius:10px;font-weight:700;font-size:15px;border:1px solid var(--border);background:var(--surface-2);color:var(--text);}
  .novedadGrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:8px;}
  .novCard{background:var(--surface-2);border:2px solid var(--border);border-radius:16px;padding:18px 10px;display:flex;flex-direction:column;align-items:center;gap:8px;font-weight:700;font-size:15px;text-align:center;line-height:1.2;}
  .novCard svg{width:34px;height:34px;}
  .novCard.selected{border-color:var(--amber);background:rgba(255,176,32,0.12);}
  .vehicleGrid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:8px;}
  .vehicleCard{background:var(--surface-2);border:2px solid var(--border);border-radius:18px;padding:34px 10px;display:flex;flex-direction:column;align-items:center;gap:14px;font-weight:800;font-size:20px;}
  .vehicleCard svg{width:56px;height:56px;}
  .vehicleCard.selected{border-color:var(--amber);background:rgba(255,176,32,0.12);}
  .otherInput{margin-top:14px;width:100%;padding:16px;border-radius:12px;border:1px solid var(--border);background:var(--surface-2);color:var(--text);font-size:16px;font-family:'Inter',sans-serif;}
  .photoBox{aspect-ratio:4/3;border-radius:var(--radius-sm);border:2px dashed var(--border);background:var(--surface-2);display:flex;align-items:center;justify-content:center;overflow:hidden;margin-bottom:16px;}
  .photoBox img{width:100%;height:100%;object-fit:cover;}
  .photoPlaceholder{color:var(--text-dim);text-align:center;font-size:15px;padding:20px;}
  .photoPlaceholder svg{width:48px;height:48px;margin-bottom:8px;opacity:0.6;}
  .summaryRow{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--border);font-size:15px;gap:12px;}
  .summaryRow:last-child{border-bottom:none;}
  .summaryRow .k{color:var(--text-dim);flex-shrink:0;}
  .summaryRow .v{font-weight:700;text-align:right;}
  .tag{padding:4px 10px;border-radius:20px;font-size:12px;font-weight:700;white-space:nowrap;}
  .tag.ok{background:rgba(72,179,131,0.18);color:var(--ok);}
  .tag.alert{background:rgba(232,93,66,0.18);color:var(--alert);}
  .tag.info{background:rgba(91,141,239,0.18);color:var(--info);}
  .stampWrap{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:60vh;gap:18px;}
  .stamp{width:180px;height:180px;border-radius:50%;border:6px solid var(--ok);color:var(--ok);display:flex;align-items:center;justify-content:center;font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:26px;transform:rotate(-8deg) scale(0.6);opacity:0;animation:stampIn .45s cubic-bezier(.2,1.4,.4,1) forwards;text-align:center;line-height:1.1;}
  @keyframes stampIn{to{transform:rotate(-8deg) scale(1);opacity:1;}}
  .listItem{display:flex;gap:14px;padding:14px;border-radius:14px;background:var(--surface);border:1px solid var(--border);margin-bottom:10px;align-items:center;}
  .listItem img{width:64px;height:64px;border-radius:10px;object-fit:cover;background:var(--surface-2);flex-shrink:0;}
  .listItem .noimg{width:64px;height:64px;border-radius:10px;background:var(--surface-2);flex-shrink:0;display:flex;align-items:center;justify-content:center;color:var(--text-dim);font-size:11px;}
  .listItem .meta{flex:1;min-width:0;}
  .listItem .plate{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:20px;letter-spacing:0.05em;}
  .listItem .sub{font-size:12px;color:var(--text-dim);margin-top:2px;}
  .emptyState{text-align:center;color:var(--text-dim);padding:60px 20px;}
  .footNote{text-align:center;color:var(--text-dim);font-size:12px;margin-top:16px;line-height:1.5;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .liveDot{width:8px;height:8px;border-radius:50%;background:var(--ok);display:inline-block;margin-right:6px;animation:pulse 1.6s infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.3;}}
  input:focus,button:focus{outline:2px solid var(--amber);outline-offset:2px;}
  .adminLink{display:block;text-align:center;margin-top:22px;color:var(--text-dim);font-size:13px;text-decoration:underline;background:none;border:none;width:100%;padding:8px;}
  .filterRow{display:flex;gap:8px;margin-bottom:16px;}
  .chip{flex:1;padding:12px 8px;border-radius:12px;border:1px solid var(--border);background:var(--surface-2);color:var(--text-dim);font-weight:700;font-size:13px;text-align:center;}
  .chip.active{background:var(--amber);color:#F6FBF2;border-color:var(--amber);}
  .statsRow{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:18px;}
  .statCard{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px 8px;text-align:center;}
  .statCard .num{font-family:'Barlow Condensed',sans-serif;font-size:30px;font-weight:800;}
  .statCard .lbl{font-size:11px;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.04em;}
  table.reportTable{width:100%;border-collapse:collapse;font-size:13px;}
  table.reportTable th{text-align:left;color:var(--text-dim);font-weight:600;padding:8px 6px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--surface);font-size:11px;text-transform:uppercase;}
  table.reportTable td{padding:9px 6px;border-bottom:1px solid var(--border);white-space:nowrap;}
  .editRowBtn{background:var(--surface-2);border:1px solid var(--border);color:var(--amber);padding:6px 10px;border-radius:8px;font-weight:700;font-size:12px;white-space:nowrap;}
  .editRowBtn:active{background:var(--raised);}
  .tableWrap{overflow-x:auto;max-height:48vh;overflow-y:auto;border-radius:12px;border:1px solid var(--border);}
  .pinDisplay{display:flex;gap:14px;justify-content:center;margin-bottom:22px;}
  .pinDot{width:20px;height:20px;border-radius:50%;border:2px solid var(--border);}
  .pinDot.filled{background:var(--amber);border-color:var(--amber);}
  .heroBanner{
    margin:0;
    height:210px;
    position:relative;
    overflow:hidden;
    background:var(--surface-2);
  }
  .heroBanner img{width:100%;height:100%;object-fit:cover;display:block;}
  .heroBanner::after{
    content:"";position:absolute;inset:0;
    background:linear-gradient(180deg, rgba(18,26,20,0) 40%, rgba(18,26,20,0.92) 100%);
  }
  .logoBadge{
    position:relative;z-index:2;
    width:fit-content;margin:-46px auto 6px auto;
    background:#FFFFFF;border-radius:16px;
    padding:10px 20px;
    box-shadow:0 10px 24px rgba(0,0,0,0.35);
    display:flex;align-items:center;justify-content:center;
  }
  .logoBadge img{height:52px;display:block;}
  .conjuntoCaption{
    text-align:center;color:var(--text-dim);font-size:12px;
    letter-spacing:0.12em;text-transform:uppercase;font-weight:600;
    margin-bottom:18px;
  }
  .recentWrap{margin-top:16px;}
  .recentLabel{font-size:12px;color:var(--text-dim);margin-bottom:8px;text-transform:uppercase;letter-spacing:0.06em;font-weight:600;}
  .recentChips{display:flex;flex-wrap:wrap;gap:8px;}
  .recentChip{
    padding:10px 16px;border-radius:20px;border:1px solid var(--border);
    background:var(--surface-2);color:var(--text);font-weight:700;font-size:14px;
  }
  .recentChip:active{background:var(--raised);}
  .recentChip.guardChip{display:inline-flex;align-items:center;gap:2px;padding:4px 4px 4px 16px;}
  .guardChipName{padding:6px 4px;cursor:pointer;}
  .guardChipRemove{
    background:var(--surface);border:1px solid var(--border);color:var(--text-dim);
    width:26px;height:26px;border-radius:50%;font-size:13px;line-height:1;
    display:flex;align-items:center;justify-content:center;flex-shrink:0;
  }
  .guardChipRemove:active{background:var(--alert);color:#fff;border-color:var(--alert);}
  .unitGrid{display:flex;flex-direction:column;gap:16px;margin-top:10px;}
  .unitGrid .btn{padding:30px;font-size:20px;}
  .searchBox{position:relative;margin-bottom:12px;}
  .searchBox input{width:100%;padding:18px;border-radius:12px;border:1px solid var(--border);background:var(--surface-2);color:var(--text);font-size:20px;font-family:'Barlow Condensed',sans-serif;font-weight:700;letter-spacing:0.05em;}
  .aptoResults{display:flex;flex-direction:column;gap:6px;max-height:280px;overflow-y:auto;}
  .aptoResult{padding:14px 16px;border-radius:10px;background:var(--surface-2);border:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;font-weight:700;}
  .aptoResult .g{color:var(--text-dim);font-weight:600;font-size:13px;}
  .aptoResult:active{background:var(--raised);}
  .selectedUnitCard{background:var(--surface-2);border:2px solid var(--amber);border-radius:16px;padding:18px;margin-bottom:14px;}
  .selectedUnitCard .bigApto{font-family:'Barlow Condensed',sans-serif;font-size:34px;font-weight:800;color:var(--amber);}
  .selectedUnitCard .changeLink{background:none;border:none;color:var(--text-dim);font-size:13px;text-decoration:underline;padding:4px;}
  .miniHistory{margin-top:14px;}
  .miniHistoryItem{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--border);font-size:13px;color:var(--text-dim);}
  .miniHistoryItem .tag{flex-shrink:0;}
  .visitorBadge{display:inline-flex;align-items:center;gap:6px;background:rgba(91,141,239,0.18);color:var(--info);padding:6px 12px;border-radius:20px;font-size:13px;font-weight:700;margin-bottom:14px;}
  .moveGrid{display:flex;flex-direction:column;gap:10px;margin-top:8px;}
  .moveCard{display:flex;align-items:center;gap:14px;background:var(--surface-2);border:2px solid var(--border);border-radius:14px;padding:14px 16px;text-align:left;}
  .moveCard svg{width:28px;height:28px;flex-shrink:0;}
  .moveCard .moveText b{display:block;font-size:16px;}
  .moveCard .moveText span{display:block;font-size:12px;color:var(--text-dim);margin-top:2px;}
  .moveCard.selected{border-color:var(--amber);background:rgba(255,176,32,0.12);}
</style>
</head>

function withTimeout(promise, ms){
  return Promise.race([
    promise,
    new Promise((_, reject) => setTimeout(() => reject(new Error('timeout')), ms))
  ]);
}
async function attemptSaveEntry(entry){

}

function checkPendingMilestone(){
  const n = state.pendingQueue.length;
  const milestone = Math.floor(n/50)*50;
  if(milestone>0 && milestone > (state.lastNotifiedThreshold||0)){
    state.lastNotifiedThreshold = milestone;
    setTimeout(()=>{
      alert(`Ya llevas ${milestone} vehículos guardados en esta tablet esperando confirmar con el servidor.\n\nQuedan a salvo aunque no haya señal, pero sube a un piso con conexión pronto para sincronizarlos.`);
    }, 250);
  }
}
async function flushPendingQueue(){
  if(!state.pendingQueue.length || state.flushingQueue) return;
  state.flushingQueue = true;
  try{
    // Firestore ya guardó todo localmente (aunque estuviera offline); esto solo
    // espera a que confirme con el servidor para poder limpiar el contador visual.
    await db.waitForPendingWrites();
    state.pendingQueue = [];
    state.lastNotifiedThreshold = 0;
    render();
  }catch(e){
    // seguirá pendiente y se reintentará en el próximo evento 'online' o intervalo
  }
  state.flushingQueue = false;
}
window.addEventListener('online', flushPendingQueue);
setInterval(flushPendingQueue, 20000);

function topbar(){
  if(!state.guard) return '';
  const showHome = state.screen!=='home';
  const pending = state.pendingQueue.length;
  let pendingBadge = '';
  if(pending>0 && pending<20){
    pendingBadge = `<span class="tag alert" title="Ya están guardados en esta tablet; se confirmarán con el servidor apenas haya señal">⏳ ${pending} por confirmar</span>`;
  } else if(pending>=20){
    pendingBadge = `<span class="tag alert" style="animation:pulse 1s infinite;font-weight:800;" title="Ya están guardados en esta tablet; se confirmarán con el servidor apenas haya señal">⏳ ${pending} por confirmar — sube pronto a un piso con señal</span>`;
  }
  return `
  <div class="topbar" style="flex-wrap:wrap;row-gap:8px;">
    <div class="who"><b>${state.guard}</b><span>${nowClock()}</span></div>
    <div style="display:flex;gap:8px;align-items:center;">
      ${pendingBadge}
      ${showHome ? `<button class="iconbtn" onclick="goHome()">${icon_home()} Inicio</button>` : ''}
      <button class="iconbtn" onclick="doLogout()">Cambiar guardia</button>
    </div>
  </div>
  ${pending>=40 ? `<div style="background:var(--alert);color:#2a0d06;text-align:center;padding:8px;font-weight:800;font-size:13px;">⚠️ Llevas ${pending} registros guardados en esta tablet esperando confirmar con el servidor. Sube pronto a un piso con señal para sincronizarlos.</div>` : ''}` ;
}
function goHome(){
  const hasProgress = (state.draft && (state.draft.plate || state.draft.photo || state.draft.apto)) || state.selectedExit
    || state.supervisorName || state.supervisorNotes || state.supervisorPhoto || state.supervisorSignatureDataUrl;
  const midFlow = ['unitApto','unitVisitor','vehicle','plate','novedad','photo','confirm','visitorExit','supervisorReport'].includes(state.screen);
  if(midFlow && hasProgress){
    if(!confirm('Vas a salir sin guardar este registro. ¿Seguro que quieres volver al inicio?')) return;
  }
  state.draft = freshDraft();
  state.selectedExit = null;
  state.guard = null;
  state.guardNameInput = '';
  setScreen('home');
}
function doLogout(){
  if(state.pendingQueue.length){
    const n = state.pendingQueue.length;
    const ok = confirm(`Tienes ${n} registro${n>1?'s':''} guardado${n>1?'s':''} en esta tablet que aún no se han confirmado con el servidor (falta señal). Quedan a salvo aunque cambies de guardia, pero es mejor esperar a que se sincronicen si puedes. ¿Continuar de todas formas?`);
    if(!ok) return;
  }
  state.guard = null; state.guardNameInput = '';
  state.draft = freshDraft();
  setScreen('login');
}

function stepper(current,total,label){
  let dots='';
  for(let i=1;i<=total;i++){
    dots += `<div class="dot ${i<current?'done':''} ${i===current?'active':''}"></div>`;
  }
  return `<div class="stepLabel">Paso ${current} de ${total} · ${label}</div><div class="stepper">${dots}</div>`;
}

const TOTAL_STEPS = 6;

  const app = document.getElementById('app');
  let html = '';
  if(state.screen==='login') html = topbar() + renderLogin();
  else if(state.screen==='home') html = topbar() + renderHome();
  else if(state.screen==='unitApto') html = topbar() + renderUnitApto();
  else if(state.screen==='unitVisitor') html = topbar() + renderUnitVisitor();
  else if(state.screen==='visitorChoice') html = topbar() + renderVisitorChoice();
  else if(state.screen==='visitorExit') html = topbar() + renderVisitorExit();
  else if(state.screen==='visitorExitSaved') html = topbar() + renderVisitorExitSaved();
  else if(state.screen==='vehicle') html = topbar() + renderVehicle();
  else if(state.screen==='plate') html = topbar() + renderPlate();
  else if(state.screen==='novedad') html = topbar() + renderNovedad();
  else if(state.screen==='photo') html = topbar() + renderPhoto();
  else if(state.screen==='confirm') html = topbar() + renderConfirm();
  else if(state.screen==='saved') html = topbar() + renderSaved();
  else if(state.screen==='list') html = topbar() + renderList();
  else if(state.screen==='adminPin') html = renderAdminPin();
  else if(state.screen==='admin') html = renderAdmin();
  else if(state.screen==='editEntry') html = renderEditEntry();
  else if(state.screen==='editSupervisor') html = renderEditSupervisor();
  else if(state.screen==='supervisorReport') html = topbar() + renderSupervisorReport();
  else if(state.screen==='supervisorSaved') html = topbar() + renderSupervisorSaved();
  app.innerHTML = html;
  if(state.screen==='list'){
    loadTodayEntries().then(()=>{ const el=document.getElementById('listContent'); if(el) el.innerHTML = buildListContent(); });
    state.listPoll = setInterval(()=>{ loadTodayEntries().then(()=>{ const el=document.getElementById('listContent'); if(el) el.innerHTML = buildListContent(); }); }, 6000);
  }
  if(state.screen==='visitorExit' && !state.selectedExit){
    refreshExitResults(state.exitSearchQuery);
  }
  if(state.screen==='supervisorReport'){
    initSignaturePad();
  }
  if(state.screen==='admin'){
    refreshAdmin();
    state.adminPoll = setInterval(refreshAdmin, 8000);
  }
}

function onExitSearchInput(v){
  state.exitSearchQuery = v;
  refreshExitResults(v);
}
async function refreshExitResults(query){
  const box = document.getElementById('exitResults');
  if(!box) return;
  try{
    const all = await loadAllEntries();
    const q = (query||'').trim().toUpperCase();
    let open = all.filter(e => e.unitType==='visitante' && e.movementType!=='salida' && !e.salidaTimestamp);
    if(q) open = open.filter(e => (e.plate||'').toUpperCase().includes(q) || (e.parkingSpot||'').toUpperCase().includes(q));
    open = open.slice(0,20);
    state._exitCandidates = open;
    const box2 = document.getElementById('exitResults');
    if(!box2) return;
    if(!open.length){
      box2.innerHTML = `<div style="color:var(--text-dim);text-align:center;padding:16px;">Sin vehículos pendientes de salida${q?' con esa búsqueda':''}.</div>`;
      return;
    }
    box2.innerHTML = `<div class="aptoResults">${open.map(e => `
      <div class="aptoResult" onclick="selectExitEntry('${e._key}')">
        <span>${e.plate || 'Sin placa'} · Parq. ${e.parkingSpot||'—'}</span>
        <span class="g">Entró ${new Date(e.timestamp).toLocaleDateString('es-CO')} ${new Date(e.timestamp).toLocaleTimeString('es-CO',{hour:'2-digit',minute:'2-digit'})}</span>
      </div>`).join('')}</div>`;
  }catch(e){
    box.innerHTML = '<div style="color:var(--text-dim);text-align:center;padding:16px;">No se pudo cargar. Intenta de nuevo.</div>';
  }
}
function selectExitEntry(key){
  const found = (state._exitCandidates||[]).find(e => e._key===key);
  if(!found) return;
  state.selectedExit = found;
  render();
}
async function confirmExit(){
  const entry = state.selectedExit;
  if(!entry) return;
  const key = entry._key;
  const updated = { ...entry };
  delete updated._key;
  updated.salidaTimestamp = Date.now();
  updated.salidaGuard = state.guard;
  const wasOffline = !navigator.onLine;
  const ok = await attemptUpdateEntry(key, updated);
  if(!ok){
    alert('No se pudo registrar la salida. Intenta de nuevo.');
    return;
  }
  if(wasOffline){
    state.pendingQueue.push({ _updateKey: key });
    checkPendingMilestone();
  }
  state.lastExitInfo = { plate: entry.plate, parkingSpot: entry.parkingSpot, queued: wasOffline };
  state.selectedExit = null;
  state.exitSearchQuery = '';
  setScreen('visitorExitSaved');
  setTimeout(()=>{ setScreen('home'); }, wasOffline ? 3200 : 2200);
}
function renderVisitorExitSaved(){
  const info = state.lastExitInfo || {};

}

function buildNovedadesResolved(){
  const sel = state.draft.novedades || [];
  return sel.map(id => {
    const n = NOVEDADES.find(x=>x.id===id);
    const label = id==='otro' ? (state.draft.novedadOtroTexto || 'Otra novedad') : n.label;
    return { id, label, kind: n.kind };
  });
}
function novedadTagsHtml(novedadesArr){
  if(!novedadesArr || !novedadesArr.length) return '<span class="tag info">—</span>';
  return novedadesArr.map(n => `<span class="tag ${n.kind}">${n.label}</span>`).join(' ');
}
function novedadLabelsJoined(novedadesArr){
  if(!novedadesArr || !novedadesArr.length) return '—';
  return novedadesArr.map(n=>n.label).join(', ');
}

function renderNovedad(){
  const selected = state.draft.novedades || [];
  const cards = NOVEDADES.map(n => `
    <div class="novCard ${selected.includes(n.id)?'selected':''}" onclick="toggleNovedad('${n.id}')">
      ${n.icon}<span>${n.label}</span>
    </div>`).join('');
  const showOther = selected.includes('otro');
  return `
  <main>
    ${stepper(4,TOTAL_STEPS,'Tipo de novedad')}
    <p class="footNote" style="margin-top:0;margin-bottom:10px;">Puedes marcar más de una si aplica</p>

      ${showOther ? `<input id="otroTexto" class="otherInput" placeholder="Describe brevemente qué pasó" value="${state.draft.novedadOtroTexto||''}" oninput="state.draft.novedadOtroTexto=this.value">` : ''}
    </div>

      <button class="btn btn-primary" ${!selected.length?'disabled':''} onclick="goToPhoto()">Continuar →</button>
    </div>
  </main>`;
}
function toggleNovedad(id){
  let sel = state.draft.novedades || [];
  if(id==='ok'){
    // "Sin novedad" es excluyente con cualquier otra novedad puntual
    sel = sel.includes('ok') ? [] : ['ok'];
  } else {
    sel = sel.filter(x => x!=='ok'); // marcar una novedad puntual quita "sin novedad"
    if(sel.includes(id)) sel = sel.filter(x => x!==id);
    else sel = [...sel, id];
  }
  state.draft.novedades = sel;
  render();
}
function goToPhoto(){
  const sel = state.draft.novedades || [];
  if(!sel.length) return;
  if(sel.includes('otro')){

    state.draft.novedadOtroTexto = t ? t.value.trim() : state.draft.novedadOtroTexto;

function renderPhoto(){

  <main>
    ${stepper(5,TOTAL_STEPS,'Foto del vehículo')}
    <div class="card">
      <div class="photoBox">
        ${state.draft.photo ? `<img src="${state.draft.photo}">` : `<div class="photoPlaceholder">${icon_camera()}<br>Sin foto (opcional)</div>`}
      </div>
      <input type="file" accept="image/*" capture="environment" id="cameraInput" style="display:none" onchange="handlePhoto(event)">
      <input type="file" accept="image/*" id="galleryInput" style="display:none" onchange="handlePhoto(event)">
      <div class="row2">
        <button class="btn btn-primary" onclick="document.getElementById('cameraInput').click()">
          ${icon_camera()} ${state.draft.photo ? 'Tomar otra' : 'Tomar foto'}
        </button>
        <button class="btn" onclick="document.getElementById('galleryInput').click()">
          ${icon_gallery()} Elegir de galería
        </button>
      </div>
      ${state.draft.photo ? `<button class="btn" style="width:100%;margin-top:10px;" onclick="state.draft.photo=null; render();">Quitar foto</button>` : ''}
    </div>
    <div class="row2" style="margin-top:18px;">
      <button class="btn" onclick="setScreen('novedad')">← Atrás</button>
      <button class="btn btn-primary" onclick="setScreen('confirm')">${state.draft.photo ? 'Continuar →' : 'Continuar sin foto →'}</button>
    </div>
  </main>`;
}
function handlePhoto(ev){
  const file = ev.target.files[0];
  if(!file) return;
  const img = new Image();
  const reader = new FileReader();
  reader.onload = e => {
    img.onload = () => {
      const maxW = 900;
      const scale = Math.min(1, maxW/img.width);
      const canvas = document.createElement('canvas');
      canvas.width = img.width*scale;
      canvas.height = img.height*scale;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img,0,0,canvas.width,canvas.height);
      state.draft.photo = canvas.toDataURL('image/jpeg', 0.6);
      render();
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

function handleSupervisorPhoto(ev){
  const file = ev.target.files[0];
  if(!file) return;
  const img = new Image();
  const reader = new FileReader();
  reader.onload = e => {
    img.onload = () => {
      const maxW = 900;
      const scale = Math.min(1, maxW/img.width);
      const canvas = document.createElement('canvas');
      canvas.width = img.width*scale;
      canvas.height = img.height*scale;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img,0,0,canvas.width,canvas.height);
      state.supervisorPhoto = canvas.toDataURL('image/jpeg', 0.6);
      render();
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}
function initSignaturePad(){
  const canvas = document.getElementById('signatureCanvas');
  if(!canvas) return;
  const rect = canvas.getBoundingClientRect();
  canvas.width = rect.width;
  canvas.height = rect.height;
  const ctx = canvas.getContext('2d');
  ctx.strokeStyle = '#1C2530';
  ctx.lineWidth = 2.5;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  if(state.supervisorSignatureDataUrl){
    const img = new Image();
    img.onload = () => { ctx.drawImage(img, 0, 0, canvas.width, canvas.height); };
    img.src = state.supervisorSignatureDataUrl;
  }
  let drawing = false;
  let last = null;
  function pos(e){
    const r = canvas.getBoundingClientRect();
    const t = e.touches ? e.touches[0] : e;
    return { x: t.clientX - r.left, y: t.clientY - r.top };
  }
  function start(e){ drawing = true; last = pos(e); e.preventDefault(); }
  function move(e){
    if(!drawing) return;
    const p = pos(e);
    ctx.beginPath();
    ctx.moveTo(last.x, last.y);
    ctx.lineTo(p.x, p.y);
    ctx.stroke();
    last = p;
    e.preventDefault();
  }
  function end(){
    if(!drawing) return;
    drawing = false;
    try{ state.supervisorSignatureDataUrl = canvas.toDataURL('image/png'); }catch(e){}
  }
  canvas.addEventListener('mousedown', start);
  canvas.addEventListener('mousemove', move);
  window.addEventListener('mouseup', end);
  canvas.addEventListener('touchstart', start, { passive:false });
  canvas.addEventListener('touchmove', move, { passive:false });
  canvas.addEventListener('touchend', end);
}
function clearSignature(){
  const canvas = document.getElementById('signatureCanvas');
  if(canvas){ const ctx = canvas.getContext('2d'); ctx.clearRect(0,0,canvas.width,canvas.height); }
  state.supervisorSignatureDataUrl = null;
}

function filterByRange(all, filter){
  const now = Date.now();
  if(filter==='today'){
    const todayStr = new Date().toDateString();
    return all.filter(e => new Date(e.timestamp).toDateString() === todayStr);
  }
  if(filter==='7days'){
    const cutoff = now - 7*24*60*60*1000;
    return all.filter(e => e.timestamp >= cutoff);
  }
  return all;
}

      <td><button class="editRowBtn" onclick="openEditEntry('${e._key}')">✎ Editar</button></td>
    </tr>`;}).join('');
  return `
    <div class="statsRow">
      <div class="statCard"><div class="num">${total}</div><div class="lbl">Registros</div></div>
      <div class="statCard"><div class="num" style="color:var(--alert)">${conNovedad}</div><div class="lbl">Con novedad</div></div>
      <div class="statCard"><div class="num" style="color:var(--ok)">${sinNovedad}</div><div class="lbl">Sin novedad</div></div>
    </div>
    <div class="tableWrap">
      <table class="reportTable">
        <thead><tr><th>Fecha</th><th>Hora</th><th>Unidad</th><th>Movimiento</th><th>Placa</th><th>Tipo</th><th>Parq.</th><th>Salida</th><th>Novedad</th><th>Guardia</th><th></th></tr></thead>
        <tbody>${rows || `<tr><td colspan="11" style="text-align:center;color:var(--text-dim);padding:24px;">Sin registros en este rango</td></tr>`}</tbody>
      </table>
    </div>
  `;
}
function storageBannerHtml(){
  const bytes = (state.estimatedStorageBytes || 0) + (state.estimatedSupervisorBytes || 0);
  const mb = bytes/1024/1024;
  if(mb < 15) return '';
  const isAlert = mb >= 40;
  const color = isAlert ? 'var(--alert)' : 'var(--amber)';
  const msg = isAlert
    ? `Los registros ya ocupan aproximadamente ${mb.toFixed(1)} MB, un volumen alto. Descarga el Excel con fotos y considera archivar o limpiar los registros más viejos pronto.`
    : `Los registros ya ocupan aproximadamente ${mb.toFixed(1)} MB. Es buen momento para exportar y archivar los meses más antiguos.`;
  return `<div class="card" style="border-color:${color};margin-bottom:16px;">
    <b style="color:${color};">Aviso de almacenamiento</b>
    <div class="footNote" style="margin-top:6px;text-align:left;">${msg} (Esta es una estimación propia, no un límite oficial publicado por Anthropic.)</div>
  </div>`;
}
function backupBannerHtml(){
  if(!state.lastBackupTs){
    return `<div class="card" style="border-color:var(--alert);margin-bottom:16px;">
      <b style="color:var(--alert);">Aún no has descargado ningún respaldo.</b>
      <div class="footNote" style="margin-top:6px;text-align:left;">Descarga el Excel al menos una vez y guárdalo en tu Drive o computador.</div>
    </div>`;
  }
  const days = Math.floor((Date.now()-state.lastBackupTs)/(1000*60*60*24));
  const color = days<=3 ? 'var(--ok)' : (days<=7 ? 'var(--amber)' : 'var(--alert)');
  const text = days===0 ? 'hoy' : (days===1 ? 'hace 1 día' : `hace ${days} días`);
  const advice = days<=3 ? 'Todo al día.' : (days<=7 ? 'Te recomendamos respaldar pronto.' : '¡Descarga un respaldo ya!');
  return `<div class="card" style="border-color:${color};margin-bottom:16px;">
    <b style="color:${color};">Último respaldo descargado: ${text}.</b>
    <div class="footNote" style="margin-top:6px;text-align:left;">${advice}</div>
  </div>`;
}

function buildSupervisorAdminContent(){
  const entries = state.supervisorEntries || [];

  const shown = entries.slice(0,10).map(e => `

        <div style="background:#F6F6F2;border-radius:12px;padding:8px;margin-bottom:8px;"><img src="${e.signature}" style="width:100%;display:block;"></div>
        <button class="btn" style="width:100%;margin-bottom:14px;" onclick="state.editingSupervisor.signature=null; render();">Quitar firma</button>
      ` : ''}

    <div class="row2" style="margin-top:18px;">

function cancelEditSupervisor(){ state.editingSupervisor = null; setScreen('admin'); }
async function saveEditedSupervisor(){
  const e = state.editingSupervisor;
  if(!e) return;
  if(!e.supervisorName || !e.supervisorName.trim()){ alert('El nombre del supervisor no puede quedar vacío.'); return; }
  const key = e._key;
  const updated = { ...e };
  delete updated._key;
  const wasOffline = !navigator.onLine;
  const ok = await attemptUpdateEntry(key, updated);
  if(!ok){
    alert('No se pudo guardar la corrección. Intenta de nuevo.');
    return;
  }
  if(wasOffline){
    state.pendingQueue.push({ _updateKey: key });
    checkPendingMilestone();
    alert('Sin señal por ahora: la corrección quedó guardada en esta tablet y se confirmará con el servidor apenas haya conexión.');
  } else {
    alert('Reporte actualizado correctamente.');
  }
  state.editingSupervisor = null;
  setScreen('admin');
}

/* ---------- Incrustar imágenes reales dentro de un .xlsx (no como enlace) ---------- */
function dataUrlToUint8Array(dataUrl){
  const base64 = dataUrl.split(',')[1];
  const binary = atob(base64);
  const arr = new Uint8Array(binary.length);
  for(let i=0;i<binary.length;i++) arr[i] = binary.charCodeAt(i);
  return arr;
}
async function buildXlsxWithImages(ws, sheetName, imagePlacements){
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, sheetName);
  const baseArray = XLSX.write(wb, { type:'array', bookType:'xlsx' });
  const zip = await JSZip.loadAsync(baseArray);

  if(imagePlacements && imagePlacements.length){
    let mediaIdx = 1;
    let anchorsXml = '';
    let relsXml = '';
    for(const p of imagePlacements){
      const isPng = p.dataUrl.startsWith('data:image/png');
      const ext = isPng ? 'png' : 'jpeg';
      const filename = `image${mediaIdx}.${ext}`;
      zip.file(`xl/media/${filename}`, dataUrlToUint8Array(p.dataUrl));
      const rId = `rId${mediaIdx}`;
      const cx = (p.widthPx || 140) * 9525;
      const cy = (p.heightPx || 105) * 9525;
      anchorsXml += `<xdr:twoCellAnchor editAs="oneCell">
        <xdr:from><xdr:col>${p.col}</xdr:col><xdr:colOff>19050</xdr:colOff><xdr:row>${p.row}</xdr:row><xdr:rowOff>19050</xdr:rowOff></xdr:from>
        <xdr:to><xdr:col>${p.col+1}</xdr:col><xdr:colOff>0</xdr:colOff><xdr:row>${p.row+1}</xdr:row><xdr:rowOff>0</xdr:rowOff></xdr:to>
        <xdr:pic>
          <xdr:nvPicPr><xdr:cNvPr id="${mediaIdx+1}" name="Img${mediaIdx}"/><xdr:cNvPicPr><a:picLocks noChangeAspect="1"/></xdr:cNvPicPr></xdr:nvPicPr>
          <xdr:blipFill><a:blip xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships" r:embed="${rId}"/><a:stretch><a:fillRect/></a:stretch></xdr:blipFill>
          <xdr:spPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="${cx}" cy="${cy}"/></a:xfrm><a:prstGeom prst="rect"><a:avLst/></a:prstGeom></xdr:spPr>
        </xdr:pic>
        <xdr:clientData/>
      </xdr:twoCellAnchor>`;
      relsXml += `<Relationship Id="${rId}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/image" Target="../media/${filename}"/>`;
      mediaIdx++;
    }
    zip.file('xl/drawings/drawing1.xml', `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><xdr:wsDr xmlns:xdr="http://schemas.openxmlformats.org/drawingml/2006/spreadsheetDrawing" xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main">${anchorsXml}</xdr:wsDr>`);
    zip.file('xl/drawings/_rels/drawing1.xml.rels', `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">${relsXml}</Relationships>`);

    const sheetPath = 'xl/worksheets/sheet1.xml';
    let sheetXml = await zip.file(sheetPath).async('string');
    sheetXml = sheetXml.replace('</worksheet>', '<drawing r:id="rIdDraw1"/></worksheet>');
    zip.file(sheetPath, sheetXml);
    zip.file('xl/worksheets/_rels/sheet1.xml.rels', `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rIdDraw1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/drawing" Target="../drawings/drawing1.xml"/></Relationships>`);

    let ct = await zip.file('[Content_Types].xml').async('string');
    let additions = '';
    if(!ct.includes('Extension="jpeg"')) additions += `<Default Extension="jpeg" ContentType="image/jpeg"/>`;
    if(!ct.includes('Extension="png"')) additions += `<Default Extension="png" ContentType="image/png"/>`;
    if(!ct.includes('drawing1.xml')) additions += `<Override PartName="/xl/drawings/drawing1.xml" ContentType="application/vnd.openxmlformats-officedocument.drawing+xml"/>`;
    ct = ct.replace('</Types>', additions + '</Types>');
    zip.file('[Content_Types].xml', ct);
  }
  return await zip.generateAsync({ type:'blob' });
}
function downloadBlob(blob, filename){
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

async function exportSupervisorExcel(){
  const entries = state.supervisorEntries || [];
  if(!entries.length){ alert('No hay reportes de supervisor para exportar.'); return; }
  const imagePlacements = [];
  const rows = entries.map((e, idx) => {
    if(e.photo) imagePlacements.push({ row: idx+1, col: 5, dataUrl: e.photo, widthPx:140, heightPx:105 });
    if(e.signature) imagePlacements.push({ row: idx+1, col: 6, dataUrl: e.signature, widthPx:160, heightPx:70 });
    return {
      'Fecha': new Date(e.timestamp).toLocaleDateString('es-CO'),
      'Hora': new Date(e.timestamp).toLocaleTimeString('es-CO',{hour:'2-digit',minute:'2-digit'}),
      'Supervisor': e.supervisorName,
      'Novedades': e.notes || '',
      'Guardia en turno': e.guardOnDuty || '',
      'Foto': e.photo ? '' : 'Sin foto',
      'Firma': e.signature ? '' : 'Sin firma',
    };
  });
  const ws = XLSX.utils.json_to_sheet(rows);
  ws['!cols'] = [{wch:12},{wch:8},{wch:20},{wch:40},{wch:18},{wch:22},{wch:24}];
  ws['!rows'] = [{hpx:20}, ...entries.map(e => ({ hpx: (e.photo||e.signature) ? 84 : 18 }))];
  const dateStr = new Date().toISOString().slice(0,10);
  try{
    const blob = await buildXlsxWithImages(ws, 'Supervisor', imagePlacements);
    downloadBlob(blob, `reportes_supervisor_${dateStr}.xlsx`);
  }catch(e){
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Supervisor');
    XLSX.writeFile(wb, `reportes_supervisor_${dateStr}.xlsx`);
  }
}
async function exportExcel(){
  const entries = state.adminEntries;
  if(!entries.length){ alert('No hay registros para exportar en este rango.'); return; }

  const imagePlacements = [];
  const rows = entries.map((e,idx) => {
    const mv = MOVEMENTS.find(m=>m.id===e.movementType);
    if(e.photo) imagePlacements.push({ row: idx+1, col: 11, dataUrl: e.photo, widthPx:140, heightPx:105 });
    return {
      'Fecha': new Date(e.timestamp).toLocaleDateString('es-CO'),
      'Hora ingreso': new Date(e.timestamp).toLocaleTimeString('es-CO',{hour:'2-digit',minute:'2-digit'}),
      'Unidad': e.unitType==='apartamento' ? ('Apto '+e.apto) : 'Visitantes',
      'Movimiento': mv ? mv.label : '',
      'Placa': e.plate,
      'Tipo de vehículo': e.vehicleType==='moto' ? 'Moto' : 'Carro',
      'Parqueadero': e.parkingSpot || '',
      'Hora salida': e.salidaTimestamp ? new Date(e.salidaTimestamp).toLocaleTimeString('es-CO',{hour:'2-digit',minute:'2-digit'}) : '',
      'Guardia salida': e.salidaGuard || '',
      'Novedad': novedadLabelsJoined(e.novedades),
      'Guardia': e.guard,
      'Foto': e.photo ? '' : 'Sin foto',
    };
  });

  const ws = XLSX.utils.json_to_sheet(rows);
  ws['!cols'] = [{wch:12},{wch:9},{wch:14},{wch:14},{wch:10},{wch:14},{wch:12},{wch:9},{wch:16},{wch:26},{wch:18},{wch:24}];
  ws['!rows'] = [{hpx:20}, ...entries.map(e => ({ hpx: e.photo ? 84 : 18 }))];

  const dateStr = new Date().toISOString().slice(0,10);

  try{
    const blob = await buildXlsxWithImages(ws, 'Registros', imagePlacements);
    downloadBlob(blob, `bitacora_parqueaderos_${dateStr}.xlsx`);
  }catch(e){
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Registros');
    XLSX.writeFile(wb, `bitacora_parqueaderos_${dateStr}.xlsx`);
  }

  await markBackupDone();
  render();
}
